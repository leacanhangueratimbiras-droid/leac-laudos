<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEAC — Sistema de Laudos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f6fb; font-family: system-ui, sans-serif; }

    /* Disable text selection everywhere except input fields */
    #root *:not(input):not(textarea):not(select) {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }
    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm 15mm;
      }

      /* 1. Oculta TODO o conteúdo do body */
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
      body * { visibility: hidden !important; }

      /* 2. Torna visível APENAS o laudo */
      #laudo-print,
      #laudo-print * { visibility: visible !important; }

      /* 3. Posiciona o laudo no topo da página sem sobrepor
            (absolute empilha páginas; fixed coloca tudo na mesma) */
      #laudo-print {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        background: #fff !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }

      /* 4. Quebra de página entre laudos */
      .laudo-page {
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin-bottom: 0 !important;
      }
      .laudo-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      /* 5. Fidelidade de cores */
      html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body
  oncontextmenu="event.preventDefault(); return false;"
  oncopy="event.preventDefault(); return false;"
  oncut="event.preventDefault(); return false;"
>
  <div id="root"></div>

  <script>
    // Block copy/share shortcuts
    document.addEventListener("copy",  e => e.preventDefault());
    document.addEventListener("cut",   e => e.preventDefault());
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && ["c","x","u","s"].includes(e.key.toLowerCase())) {
        e.preventDefault(); return false;
      }
    });
    document.addEventListener("dragstart", e => e.preventDefault());
  </script>
